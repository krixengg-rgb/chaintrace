services:
  - type: web
    name: chaintrace
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt && python3 update_labels.py --cleanup
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: CHAINTRACE_USER
        sync: false
      - key: CHAINTRACE_PASSWORD
        sync: false
      - key: CHAINTRACE_CACHE
        value: /tmp/chaintrace-cache.sqlite
